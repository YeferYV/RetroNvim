[mgr]

prepend_keymap = [

	# Search by First Char
	{ on = [ "f", "a" ], run = "find_do '^a' --smart", desc = "find ^a" },
	{ on = [ "f", "b" ], run = "find_do '^b' --smart", desc = "find ^b" },
	{ on = [ "f", "c" ], run = "find_do '^c' --smart", desc = "find ^c" },
	{ on = [ "f", "d" ], run = "find_do '^d' --smart", desc = "find ^d" },
	{ on = [ "f", "e" ], run = "find_do '^e' --smart", desc = "find ^e" },
	{ on = [ "f", "f" ], run = "find_do '^f' --smart", desc = "find ^f" },
	{ on = [ "f", "g" ], run = "find_do '^g' --smart", desc = "find ^g" },
	{ on = [ "f", "h" ], run = "find_do '^h' --smart", desc = "find ^h" },
	{ on = [ "f", "i" ], run = "find_do '^i' --smart", desc = "find ^i" },
	{ on = [ "f", "j" ], run = "find_do '^j' --smart", desc = "find ^j" },
	{ on = [ "f", "k" ], run = "find_do '^k' --smart", desc = "find ^k" },
	{ on = [ "f", "l" ], run = "find_do '^l' --smart", desc = "find ^l" },
	{ on = [ "f", "m" ], run = "find_do '^m' --smart", desc = "find ^m" },
	{ on = [ "f", "n" ], run = "find_do '^n' --smart", desc = "find ^n" },
	{ on = [ "f", "o" ], run = "find_do '^o' --smart", desc = "find ^o" },
	{ on = [ "f", "p" ], run = "find_do '^p' --smart", desc = "find ^p" },
	{ on = [ "f", "q" ], run = "find_do '^q' --smart", desc = "find ^q" },
	{ on = [ "f", "r" ], run = "find_do '^r' --smart", desc = "find ^r" },
	{ on = [ "f", "s" ], run = "find_do '^s' --smart", desc = "find ^s" },
	{ on = [ "f", "t" ], run = "find_do '^t' --smart", desc = "find ^t" },
	{ on = [ "f", "u" ], run = "find_do '^u' --smart", desc = "find ^u" },
	{ on = [ "f", "v" ], run = "find_do '^v' --smart", desc = "find ^v" },
	{ on = [ "f", "w" ], run = "find_do '^w' --smart", desc = "find ^w" },
	{ on = [ "f", "x" ], run = "find_do '^x' --smart", desc = "find ^x" },
	{ on = [ "f", "y" ], run = "find_do '^y' --smart", desc = "find ^y" },
	{ on = [ "f", "z" ], run = "find_do '^z' --smart", desc = "find ^z" },

	# Filter
	{ on = [ "F" ],      run = """ filter --smart                                       """,                  desc = "Filter" },
	{ on = [ "g", "c" ], run = """ cd ~/.config                                         """,                  desc = "󱧼 Go ~/.config" },
	{ on = [ "g", "d" ], run = """ cd ~/Downloads                                       """,                  desc = "󰉍 Go ~/Downloads" },
	{ on = [ "g", "D" ], run = """ cd ~/Documents                                       """,                  desc = "󱧶 Go ~/Documents" },
	{ on = [ "g", "h" ], run = """ cd ~                                                 """,                  desc = "󱂵 Go home" },
	{ on = [ "g", "g" ], run = """ arrow -9999                                          """,                  desc = "󰛃 Go top" },
	{ on = [ "g", "s" ], run = """ cd $YAZI_CONFIG_HOME/..                              """, for = "unix",    desc = " retronvim settings" },
	{ on = [ "g", "s" ], run = """ cd %YAZI_CONFIG_HOME%/..                             """, for = "windows", desc = " retronvim settings" },
	{ on = [ "g", "r" ], run = """ plugin cd-git-root                                   """,                  desc = " git root" },
	{ on = [ "i" ],      run = """ shell --block -- bat --paging always --wrap never %s """,                  desc = "Bat open selected" },

  # Navigation
	{ on = [   "J"   ], run = "seek 10",    desc = "preview next page" },
	{ on = [   "K"   ], run = "seek -10",   desc = "preview previous page" },
	{ on = [   "j"   ], run = "arrow 1",   desc = "down until end of list" },
	{ on = [   "k"   ], run = "arrow -1",  desc = "up until start of list " },
	{ on = [ "<A-j>" ], run = "arrow 10",  desc = "move cursor down 10 lines" },
	{ on = [ "<A-k>" ], run = "arrow -10", desc = "move cursor up 10 lines" },
	{ on = [   "R"   ], run = "refresh",   desc = "refresh" },

  # Plugins
	{ on = [ "l" ],       run = "plugin smart-enter",      desc = "open directory or file" },
	{ on = [ "<Enter>" ], run = "plugin smart-enter",      desc = "open directory or file" },
	{ on = [ "m" ],       run = "plugin bookmarks save",   desc = "bookmark create" },
	{ on = [ "'" ],       run = "plugin bookmarks jump",   desc = "bookmark jump" },
	{ on = [ '"' ],       run = "plugin bookmarks delete", desc = "bookmark delete" },

  # Shell
	{ on = [ "s", "c" ], run = """ shell          -- google-chrome %s || google-chrome-stable %s """, for = "unix",    desc = " chrome (to drag and drop)" }, # or copy file path into the browser to drag and drop from download icon (images are draggable, some files you need right-click to download)
	{ on = [ "s", "c" ], run = """ shell          -- chrome  %s                                  """, for = "windows", desc = " chrome (to drag and drop)" }, # or copy file path into the browser to drag and drop from download icon (images are draggable, some files you need right-click to download)
	{ on = [ "s", "D" ], run = """ search fd                                                     """,                  desc = " fd" },
	{ on = [ "s", "f" ], run = """ shell --block  -- nvim -c "lua Snacks.picker.files()"         """,                  desc = " fzf" },     # on current directory
	{ on = [ "s", "g" ], run = """ shell --block  -- nvim -c "lua Snacks.picker.grep()"          """,                  desc = " rg (ctrl+f scrolls)" }, # on current directory, type `.` dot to show all files
	{ on = [ "s", "l" ], run = """ shell --block  -- lazygit                                     """,                  desc = "󰊢 lazygit" },
	{ on = [ "s", "m" ], run = """ shell --orphan -- mpv %s                                      """,                  desc = " mpv" },
	{ on = [ "s", "n" ], run = """ shell --block  -- nvim %s                                     """,                  desc = " neovim" },    # opens all selections
  { on = [ "s", "p" ], run = """ shell          -- zathura --config-dir="$ZATHURARC" %s &      """, for = "linux",   desc = " zathura" },
	{ on = [ "s", "s" ], run = """ shell          -- code  %s                                    """,                  desc = " vscode" },
	{ on = [ "s", "t" ], run = """ search_do --via=rg                                            """,                  desc = "󰙅 tree view" },
	{ on = [ "s", "v" ], run = """ shell --orphan -- vlc --avcodec-hw=none %s                    """,                  desc = "󰕼 vlc (no gpu)" }, # disables hardware decoding which fixes no video output due to gpu drivers (--avcodec-hw=vdpau also works on archlinux or configure it in the GUI) see: https://wiki.archlinux.org/title/VLC_media_player
	{ on = [ "s", "w" ], run = """ shell --block  -- zsh                                         """,                  desc = " zsh" },
	{ on = [ "s", "x" ], run = """ shell --orphan -- xdg-open %s                                 """, for = "linux",   desc = " xdg-open" },
	{ on = [ "s", "z" ], run = """ shell          -- 7zz a -tzip $1.zip %s                       """,                  desc = "󰛫 7zip selection" }, # on windows: m2-p7zip cannot extractand 7zip cannot zip

]

[[mgr.append_keymap]]
on = [ "s", "/" ]
run = '''
  shell
  --block
  -- ya emit reveal "$(rg --files --sortr=path | fzf --no-sort --preview-window=nohidden)"
'''
desc = " fzf sorted (? previews)" # shift + down/up scrolls preview # resizable preview with mouse

[[mgr.append_keymap]]
on = [ "s", "r" ]
run = '''
  shell
  --block
  -- rg "" --color=always --line-number --sort=path | fzf --no-sort --layout=reverse --ansi --delimiter : --preview "bat --color=always {1} --highlight-line {2}" --preview-window "up,60%,+{2},nohidden" --bind "enter:become(ya emit reveal {1}; nvim {1} +{2})"
'''
desc = " rg (󰘶 ↓ scrolls)" # shift + down/up scrolls preview # resizable preview with mouse

[[mgr.append_keymap]]
on = [ "s", "S" ]
run = '''
  shell
  --block
  -- powershell -noprofile -noexit -c " cd $(pwd); set-psreadlineoption -editmode vi "
'''
for = "windows"
desc = "󰨊 powershell" # bracket e.g. [directory] and whitespaces e.g. /direc tory/ not supported on powershell

[[mgr.append_keymap]]
on = [ "s", "W" ]
run = '''
  shell
  --block
  -- bash -c 'y() { yazi --cwd-file=$HOME/.yazi; cd "$(cat $HOME/.yazi)"; }; export -f y; stty echo; bash -o vi'
'''
desc = " bash"

