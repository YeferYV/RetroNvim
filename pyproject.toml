# ╭────────────────────────────╮
# │ uv tool install .          │
# │ uv tool uninstall retrovim │
# ╰────────────────────────────╯

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
# requires = ["uv_build>=0.12,<0.13"]
# build-backend = "uv_build"

[project]
name = "retronvim"
version = "0.4.8"
description = "minimal neovim, yazi, zsh, and kanata setup"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-3.0" }
dependencies = []

[project.scripts]
kanata_touchcursor = "kanata_touchcursor:main"
nvim = "nvim:main"
yazi = "yazi:main"
zsh = "zsh:main"

# # https://docs.astral.sh/uv/concepts/build-backend/#file-inclusion-and-exclusion
# [tool.uv.build-backend]
# module-root = ".pip"
# module-name = ["kanata_touchcursor", "nvim", "yazi", "zsh"]
# data = { data = "." } # pip doesn't include it
# wheel-exclude = [".git","tests"]

[tool.hatch.build.targets.wheel]
packages = [
    ".pip/kanata_touchcursor",
    ".pip/nvim",
    ".pip/yazi",
    ".pip/zsh",
]

[tool.hatch.build.targets.wheel.force-include]
"." = "data"
