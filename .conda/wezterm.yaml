context:
  version: 2026.01.17

package:
  name: wezterm
  version: ${{ version }}

source:
  - if: linux
    then:
      url: https://github.com/wezterm/wezterm/releases/download/nightly/WezTerm-nightly-Ubuntu20.04.AppImage
      target_directory: "opt/wezterm"

  - if: osx
    then:
      url: https://github.com/wezterm/wezterm/releases/download/nightly/WezTerm-macos-nightly.zip
      target_directory: "opt/wezterm"

  - if: win
    then:
      url: https://github.com/wezterm/wezterm/releases/download/nightly/WezTerm-windows-nightly.zip
      target_directory: "opt/wezterm"

build:
  # number: 0 # build version

  dynamic_linking:
    # fixes macos builds from linux: failed to find `install_name_tool`
    # https://rattler-build.prefix.dev/latest/build_options/#dynamic-linking-configuration
    binary_relocation: false

  script:
    interpreter: bash
    content:
      - mkdir -p      $PREFIX/bin
      - cp    -rv opt $PREFIX/opt

      - if: linux
        then: |

          ############################################################################################################################

          chmod +x $PREFIX/opt/wezterm/WezTerm*
          cat   >> $PREFIX/bin/wezterm <<< '#!/bin/bash'
          cat   >> $PREFIX/bin/wezterm <<< 'export WEZTERM_CONFIG_FILE="$CONDA_PREFIX/opt/retronvim/zsh/wezterm.lua"'
          cat   >> $PREFIX/bin/wezterm <<< 'exec $CONDA_PREFIX/opt/wezterm/WezTerm* "$@"'
          chmod +x $PREFIX/bin/wezterm

          ############################################################################################################################

      - if: osx
        then: |

          ############################################################################################################################

          cat   >> $PREFIX/bin/wezterm <<< '#!/bin/bash'
          cat   >> $PREFIX/bin/wezterm <<< 'export WEZTERM_CONFIG_FILE="$CONDA_PREFIX/opt/retronvim/zsh/wezterm.lua"'
          cat   >> $PREFIX/bin/wezterm <<< 'exec $CONDA_PREFIX/opt/wezterm/Wezterm.app/Contents/MacOS/wezterm-gui "$@"'
          chmod +x $PREFIX/bin/wezterm

          ############################################################################################################################

      - if: win
        then: |

          ############################################################################################################################

          rm     $PREFIX/opt/wezterm/wezterm.pdb
          cat >> $PREFIX/bin/wezterm.cmd <<< '@echo off'
          cat >> $PREFIX/bin/wezterm.cmd <<< 'set WEZTERM_CONFIG_FILE=%CONDA_PREFIX%/opt/retronvim/zsh/wezterm.lua'
          cat >> $PREFIX/bin/wezterm.cmd <<< 'start %CONDA_PREFIX%/opt/wezterm/wezterm-gui.exe %*'

      ############################################################################################################################

      # https://rattler-build.prefix.dev/latest/system_integration
      # https://prefix.dev/blog/using-pixi-as-a-system-package-manager-with-shortcuts-and-completions
      # https://github.com/conda-forge/alacritty-feedstock/blob/main/recipe/menu.json

      - |
        mkdir                                 $PREFIX/Menu
        cp $RECIPE_DIR/wezterm.{png,ico,icns} $PREFIX/Menu
        cat                                >> $PREFIX/Menu/menu.json <<'EOF'
        {
          "$schema": "https://schemas.conda.org/menuinst/menuinst-1-1-3.schema.json",
          "menu_name": "wezterm",
          "menu_items": [
            {
              "name": "Wezterm",
              "description": "A GPU-accelerated cross-platform terminal emulator and multiplexer",
              "icon": "{{ MENU_DIR }}/wezterm.{{ ICON_EXT }}",
              "command": [ "{{ HOME }}/.pixi/bin/wezterm" ],
              "platforms": {
                "osx": {},
                "linux": {},
                "win": {
                  "command": [ "{{ HOME }}/.pixi/bin/wezterm.exe" ],
                  "desktop": true
                }
              }
            }
          ]
        }
        EOF

      ############################################################################################################################

requirements:
  run:
    - retronvim

tests:
  - package_contents:
      bin:
        - wezterm*

about:
  summary: wezterm preconfigured with retronvim
  description: |
    A GPU-accelerated cross-platform terminal emulator and multiplexer written by @wez and implemented in Rust
  homepage: https://wezterm.org
  repository: https://github.com/wezterm/wezterm
