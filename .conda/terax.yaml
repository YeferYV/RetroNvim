# rattler-build upload anaconda --owner retronvim ./terax-channel/*/*conda

context:
  version: 0.8.6

package:
  name: terax
  version: ${{ version }}

source:
  - if: target_platform == "linux-64"
    then:
      # - url: https://github.com/crynta/terax-ai/releases/download/v${{ version }}/terax_${{ version }}_amd64.AppImage
      - url: https://github.com/crynta/terax-ai/releases/download/v${{ version }}/terax_${{ version }}_amd64.deb


  - if: target_platform == "osx-64"
    then:
      # - url: https://github.com/crynta/terax-ai/releases/download/v${{ version }}/terax_x64.app.tar.gz
      - url: https://github.com/crynta/terax-ai/releases/download/v${{ version }}/terax_${{ version }}_x64.dmg


  - if: target_platform == "osx-arm64"
    then:
      # - url: https://github.com/crynta/terax-ai/releases/download/v${{ version }}/terax_${{ version }}_aarch64.app.tar.gz
      - url: https://github.com/crynta/terax-ai/releases/download/v${{ version }}/terax_${{ version }}_aarch64.dmg


  - if: target_platform == "win-64"
    then:
      # - url: https://github.com/crynta/terax-ai/releases/download/v${{ version }}/terax_${{ version }}_x64-setup.exe
      - url: https://github.com/crynta/terax-ai/releases/download/v${{ version }}/terax_${{ version }}_x64_en-US.msi


build:
  # number: 0 # build version

  dynamic_linking:
    # fixes macos builds from linux: failed to find `install_name_tool`
    # https://rattler-build.prefix.dev/latest/build_options/#dynamic-linking-configuration
    binary_relocation: false

  script:
    interpreter: bash
    content:
      - mkdir -p      $PREFIX/bin

      - if: linux
        then: |

          ############################################################################################################################

          7zz x terax*
          7zz x data.tar
          cp usr/bin/terax $PREFIX/bin/terax

          ############################################################################################################################

      - if: osx
        then: |

          ############################################################################################################################

          7zz x terax*
          cp Terax/Terax.app/Contents/MacOS/terax $PREFIX/bin/terax

          ############################################################################################################################

      - if: win
        then: |

          ############################################################################################################################

          7zz x terax*
          cp Path $PREFIX/bin/terax.exe

          ############################################################################################################################

      # https://rattler-build.prefix.dev/latest/system_integration
      # https://prefix.dev/blog/using-pixi-as-a-system-package-manager-with-shortcuts-and-completions
      # https://github.com/conda-forge/alacritty-feedstock/blob/main/recipe/menu.json

      - |
        mkdir                               $PREFIX/Menu
        cp $RECIPE_DIR/terax.{png,ico,icns} $PREFIX/Menu
        cat                              >> $PREFIX/Menu/menu.json <<'EOF'
        {
          "$schema": "https://schemas.conda.org/menuinst/menuinst-1-1-3.schema.json",
          "menu_name": "terax",
          "menu_items": [
            {
              "name": "terax",
              "description": "Lightweight (7MB) Terminal-first AI-native dev workspace",
              "icon": "{{ MENU_DIR }}/terax.{{ ICON_EXT }}",
              "command": [ "{{ HOME }}/.pixi/bin/terax" ],
              "platforms": {
                "osx": {},
                "linux": {
                  "Categories": [ "Development", "TerminalEmulator", "System" ]
                },
                "win": {
                  "command": [ "{{ HOME }}/.pixi/bin/terax.exe" ],
                  "desktop": true
                }
              }
            }
          ]
        }
        EOF

      ############################################################################################################################

tests:
  - package_contents:
      bin:
        - terax*


requirements:
  build:
    - 7zip=26.00

  # run:
  #   - if: linux
  #     then:
  #       - webkit2gtk4.1=2.48.5 # https://v2.tauri.app/start/prerequisites/#linux

about:
  summary: Lightweight (7MB) Terminal-first AI-native dev workspace
  description: |
    Terax is a lightweight open-source terminal (ADE) built on Tauri 2 + Rust and React 19.
    A native PTY backend with a WebGL renderer, an agentic AI side-panel that runs against your own keys
    or fully local models, plus a code editor, file explorer, source control with a git graph,
    and a web preview pane built in. About 7-8 MB on disk. No telemetry. No account.
  homepage: https://terax.app
  repository: https://github.com/crynta/terax-ai
