# rattler-build build --recipe terax.yaml --target-platform linux-64  --output-dir terax-channel
# rattler-build build --recipe terax.yaml --target-platform osx-64    --output-dir terax-channel
# rattler-build build --recipe terax.yaml --target-platform osx-arm64 --output-dir terax-channel
# rattler-build build --recipe terax.yaml --target-platform win-64    --output-dir terax-channel

# https://pixi.prefix.dev/dev/reference/cli/pixi/clean/cache
# pixi clean cache --build --yes

# https://pixi.prefix.dev/dev/reference/cli/pixi/global/install
# pixi g install --path ./terax-channel/linux-64/terax*
# pixi g install --path ./terax-channel/linux-aarch64/terax*
# pixi g install --path ./terax-channel/osx-64/terax*
# pixi g install --path ./terax-channel/osx-aarch64/terax*
# pixi g install --path ./terax-channel/win-64/terax-0.8.6-h9490d1a_0.conda

# https://rattler-build.prefix.dev/latest/getting_started/#authentication
# rattler-build auth login anaconda.org --conda-token $ANACONDA_API_KEY

