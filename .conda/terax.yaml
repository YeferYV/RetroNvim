# pixi g install      --path ./terax-channel/osx-64/terax*                            --force-reinstall -c conda-forge -c $PWD/firacode-channel -c $PWD/kanata-channel -c $PWD/retronvim-channel
# pixi g install      --path ./terax-channel/win-64/terax-0.8.0-h9490d1a_1.conda --force-reinstall -c conda-forge -c $PWD/firacode-channel -c $PWD/kanata-channel -c $PWD/retronvim-channel -c $PWD/msys2-channel

