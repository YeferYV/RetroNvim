# https://rattler-build.prefix.dev/latest/tutorials/repackaging/
# rattler-build build --recipe appman.yaml --target-platform linux-64 --output-dir appman-channel --build-num=+1

# rm -r ~/.cache/rattler
# pixi g install      --path ./appman-channel/linux-64/appman*                      --force-reinstall

# https://pixi.prefix.dev/dev/reference/cli/pixi/upload/anaconda/
# pixi upload anaconda --owner=retronvim appman*/*/*conda

context:
  version: 10.2.1

package:
  name: appman
  version: ${{ version }}

source:
  - url: https://raw.githubusercontent.com/ivan-hc/AM/refs/heads/10.2.1/APP-MANAGER
    file_name: appman

build:
  # number: 0 # build version

  script:
    interpreter: bash
    content:

      - if: linux
        then:
          - mkdir  -p $PREFIX/opt/appman/bin $PREFIX/bin
          - cp appman $PREFIX/opt/appman/bin
          - chmod  +x $PREFIX/opt/appman/bin/appman
          - cat    >> $PREFIX/opt/appman/appman-config <<< '.local'
          - cat    >> $PREFIX/bin/appman               <<< '#!/bin/bash'
          - cat    >> $PREFIX/bin/appman               <<< 'export XDG_CONFIG_HOME=$CONDA_PREFIX/opt'
          - cat    >> $PREFIX/bin/appman               <<< 'export PATH=/bin:$PATH'
          - cat    >> $PREFIX/bin/appman               <<< 'exec $CONDA_PREFIX/opt/appman/bin/appman "$@"'
          - chmod  +x $PREFIX/bin/appman

tests:
  - package_contents:
      bin:
        - appman*

about:
  summary: AppImage Package Manager (3100+ packages)
  description: |
    search packages at https://portable-linux-apps.github.io/apps
  homepage: https://portable-linux-apps.github.io
  repository: https://github.com/ivan-hc/AM
