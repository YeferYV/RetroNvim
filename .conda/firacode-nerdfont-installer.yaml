# pixi g install      --path ./firacode-channel/linux-64/firacode*                     --force-reinstall
# pixi g install      --path ./firacode-channel/osx-64/firacode*                       --force-reinstall
# pixi g install      --path ./firacode-channel/win-64/firacode-3.4.0-h9490d1a_1.conda --force-reinstall

