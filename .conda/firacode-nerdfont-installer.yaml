# rattler-build build --recipe firacode-nerdfont-installer.yaml --target-platform osx-64   --output-dir firacode-channel --build-num=+1
# rattler-build build --recipe firacode-nerdfont-installer.yaml --target-platform win-64   --output-dir firacode-channel --build-num=+1

