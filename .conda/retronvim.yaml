# rattler-build build   --recipe retronvim.yaml --target-platform linux-64    --output-dir retronvim-channel
# rattler-build build   --recipe retronvim.yaml --target-platform osx-64      --output-dir retronvim-channel
# rattler-build build   --recipe retronvim.yaml --target-platform osx-arm64   --output-dir retronvim-channel
# rattler-build build   --recipe retronvim.yaml --target-platform win-64      --output-dir retronvim-channel

# https://pixi.prefix.dev/dev/reference/cli/pixi/clean/cache
# pixi clean cache --build --yes

# https://pixi.prefix.dev/dev/reference/cli/pixi/global/install
# pixi g install  --path ./retronvim-channel/noarch/retronvim-0.4.9-h4616a5c_0.conda -c conda-forge -c ./firacode-channel -c ./mise-channel -c ./terax-channel -c ./win32-channel -c ./zsh-patina-channel -c ./zsh-channel

# https://rattler-build.prefix.dev/latest/getting_started/#authentication
# rattler-build auth login anaconda.org --conda-token $ANACONDA_API_KEY

# https://rattler-build.prefix.dev/latest/getting_started/#publishing-the-package
# rattler-build publish --recipe retronvim.yaml --target-platform linux-64    --to https://anaconda.org/retronvim
# rattler-build publish --recipe retronvim.yaml --target-platform osx-64      --to https://anaconda.org/retronvim
# rattler-build publish --recipe retronvim.yaml --target-platform osx-arm64   --to https://anaconda.org/retronvim
# rattler-build publish --recipe retronvim.yaml --target-platform win-64      --to https://anaconda.org/retronvim

context:
  version: 0.4.9

package:
  name: retronvim
  version: ${{ version }}

source:
  # - git: https://github.com/yeferyv/retronvim
  #   target_directory: retronvim
  #   depth: 1
  #   submodules: true

  - path: ..
    target_directory: opt/retronvim
    filter:
      exclude:
        - .git
        - nvim/plugins/*/tests

build:
  # number: 0 # build version

  dynamic_linking:
    # fixes macos builds from linux: failed to find `install_name_tool`
    # https://rattler-build.prefix.dev/latest/build_options/#dynamic-linking-configuration
    binary_relocation: false

  script:
    interpreter: bash
    content:
      - mkdir -p     $PREFIX/bin $PREFIX/Library/bin
      - cp    -r opt $PREFIX/opt

      - if: unix
        then: |

          ############################################################################################################################

          cat   >> $PREFIX/bin/git <<< '#!/bin/bash'
          cat   >> $PREFIX/bin/git <<< 'export CONDA_PREFIX=${CONDA_PREFIX:-$(dirname $(dirname $(realpath $0)))}'
          cat   >> $PREFIX/bin/git <<< 'cp --update $CONDA_PREFIX/__clobbers__/git/bin/git $CONDA_PREFIX/bin/git.2.53.0'
          cat   >> $PREFIX/bin/git <<< 'exec git.2.53.0 "$@"'
          chmod +x $PREFIX/bin/git

          ############################################################################################################################

          cat   >> $PREFIX/bin/kanata_touchcursor <<< '#!/bin/bash'
          cat   >> $PREFIX/bin/kanata_touchcursor <<< 'export CONDA_PREFIX=${CONDA_PREFIX:-$(dirname $(dirname $(realpath $0)))}'
          cat   >> $PREFIX/bin/kanata_touchcursor <<< 'sudo --validate'
          cat   >> $PREFIX/bin/kanata_touchcursor <<< 'sudo --preserve-env $CONDA_PREFIX/bin/kanata --cfg $CONDA_PREFIX/opt/retronvim/kanata/touchcursor.kbd & disown'
          chmod +x $PREFIX/bin/kanata_touchcursor

          ############################################################################################################################

          cat   >> $PREFIX/bin/nvim <<< '#!/bin/bash'
          cat   >> $PREFIX/bin/nvim <<< 'export CONDA_PREFIX=${CONDA_PREFIX:-$(dirname $(dirname $(realpath $0)))}'
          cat   >> $PREFIX/bin/nvim <<< 'export SHELL=zsh'
          cat   >> $PREFIX/bin/nvim <<< 'export VIMINIT="lua vim.cmd.source(vim.env.CONDA_PREFIX .. [[/opt/retronvim/nvim/init.lua]])"'
          cat   >> $PREFIX/bin/nvim <<< 'export ZDOTDIR="$CONDA_PREFIX/opt/retronvim/zsh"'
          cat   >> $PREFIX/bin/nvim <<< 'cp --update $CONDA_PREFIX/__clobbers__/nvim/bin/nvim $CONDA_PREFIX/bin/nvim.0.12'
          cat   >> $PREFIX/bin/nvim <<< 'exec nvim.0.12 "$@"'
          chmod +x $PREFIX/bin/nvim

          ############################################################################################################################

          cat   >> $PREFIX/bin/terax <<< '#!/bin/bash'
          cat   >> $PREFIX/bin/terax <<< 'export CONDA_PREFIX=${CONDA_PREFIX:-$(dirname $(dirname $(realpath $0)))}'
          cat   >> $PREFIX/bin/terax <<< 'export ZDOTDIR=$CONDA_PREFIX/opt/retronvim/zsh'
          cat   >> $PREFIX/bin/terax <<< 'exec $CONDA_PREFIX/__clobbers__/terax/bin/terax "$@"'
          chmod +x $PREFIX/bin/terax

          ############################################################################################################################

          cat   >> $PREFIX/bin/yazi <<< '#!/bin/bash'
          cat   >> $PREFIX/bin/yazi <<< 'export BAT_THEME="base16"'
          cat   >> $PREFIX/bin/yazi <<< 'export CONDA_PREFIX=${CONDA_PREFIX:-$(dirname $(dirname $(realpath $0)))}'
          cat   >> $PREFIX/bin/yazi <<< 'export FZF_DEFAULT_OPTS='\''--color "hl:-1:reverse,hl+:-1:reverse" --preview "bat --color=always {}" --preview-window=hidden --bind "?:toggle-preview" --multi'\'
          cat   >> $PREFIX/bin/yazi <<< 'export LESS="--ignore-case"'
          cat   >> $PREFIX/bin/yazi <<< 'export LESSKEYIN="$CONDA_PREFIX/opt/retronvim/yazi/lesskey"'
          cat   >> $PREFIX/bin/yazi <<< 'export LESSHISTFILE="-"'
          cat   >> $PREFIX/bin/yazi <<< 'export YAZI_CONFIG_HOME="$CONDA_PREFIX/opt/retronvim/yazi"'
          cat   >> $PREFIX/bin/yazi <<< 'exec $CONDA_PREFIX/__clobbers__/yazi/bin/yazi "$@"'
          chmod +x $PREFIX/bin/yazi

          ############################################################################################################################

          cat   >> $PREFIX/bin/zsh <<< '#!/bin/bash'
          cat   >> $PREFIX/bin/zsh <<< 'export CONDA_PREFIX=${CONDA_PREFIX:-$(dirname $(dirname $(realpath $0)))}'
          cat   >> $PREFIX/bin/zsh <<< 'export ZDOTDIR="$CONDA_PREFIX/opt/retronvim/zsh"'
          cat   >> $PREFIX/bin/zsh <<< 'exec zsh-5.9 "$@"'
          chmod +x $PREFIX/bin/zsh

          ############################################################################################################################

      - if: win
        then: |

          ############################################################################################################################

          cat >> $PREFIX/bin/git.cmd <<< '@echo off'
          cat >> $PREFIX/bin/git.cmd <<< 'git.exe %*'

          ############################################################################################################################

          cat >> $PREFIX/bin/kanata_touchcursor.cmd <<< 'set CONDA_PREFIX=%~f0\..\..'
          cat >> $PREFIX/bin/kanata_touchcursor.cmd <<< 'powershell -c "Set-WinUserLanguageList -force en-US,es-US"'
          cat >> $PREFIX/bin/kanata_touchcursor.cmd <<< 'start conhost --headless %CONDA_PREFIX%/bin/kanata.exe --cfg %CONDA_PREFIX%/opt/retronvim/kanata/touchcursor.kbd'

          ############################################################################################################################

          cat >> $PREFIX/Library/bin/nvim.cmd <<< '@echo off'
          cat >> $PREFIX/Library/bin/nvim.cmd <<< 'set CONDA_PREFIX=%~f0\..\..'
          cat >> $PREFIX/Library/bin/nvim.cmd <<< 'set SHELL=zsh.exe'
          cat >> $PREFIX/Library/bin/nvim.cmd <<< 'set "VIMINIT=lua vim.cmd.source(vim.env.CONDA_PREFIX .. [[/opt/retronvim/nvim/init.lua]])"'
          cat >> $PREFIX/Library/bin/nvim.cmd <<< 'set ZDOTDIR=%CONDA_PREFIX%/opt/retronvim/zsh'
          cat >> $PREFIX/Library/bin/nvim.cmd <<< 'nvim %*'

          ############################################################################################################################

          cat >> $PREFIX/bin/terax.cmd <<< '@echo off'
          cat >> $PREFIX/bin/terax.cmd <<< 'set CONDA_PREFIX=%~f0\..\..'
          cat >> $PREFIX/bin/terax.cmd <<< 'set ZDOTDIR=%CONDA_PREFIX%/opt/retronvim/zsh'
          cat >> $PREFIX/bin/terax.cmd <<< 'start terax.exe %*'

          ############################################################################################################################

          cat >> $PREFIX/bin/yazi.cmd <<< '@echo off'
          cat >> $PREFIX/bin/yazi.cmd <<< 'set CONDA_PREFIX=%~f0\..\..'
          cat >> $PREFIX/bin/yazi.cmd <<< 'set BAT_THEME=base16'
          cat >> $PREFIX/bin/yazi.cmd <<< 'set FZF_DEFAULT_OPTS=--color "hl:-1:reverse,hl+:-1:reverse" --preview "bat --color=always {}" --preview-window=hidden --bind "?:toggle-preview" --multi'
          cat >> $PREFIX/bin/yazi.cmd <<< 'set LESS=--ignore-case'
          cat >> $PREFIX/bin/yazi.cmd <<< 'set LESSKEYIN=%CONDA_PREFIX%/opt/retronvim/yazi/lesskey'
          cat >> $PREFIX/bin/yazi.cmd <<< 'set LESSHISTFILE=-'
          cat >> $PREFIX/bin/yazi.cmd <<< 'set YAZI_CONFIG_HOME=%CONDA_PREFIX%/opt/retronvim/yazi'
          cat >> $PREFIX/bin/yazi.cmd <<< 'yazi.exe %*'

          ############################################################################################################################

          cat >> $PREFIX/bin/zsh.cmd <<< '@echo off'
          cat >> $PREFIX/bin/zsh.cmd <<< 'set CONDA_PREFIX=%~f0\..\..'
          cat >> $PREFIX/bin/zsh.cmd <<< 'set ZDOTDIR=%CONDA_PREFIX%/opt/retronvim/zsh'
          cat >> $PREFIX/bin/zsh.cmd <<< 'zsh.exe %*'

          cat >> $PREFIX/bin/pwsh.cmd <<< '@echo off'
          cat >> $PREFIX/bin/pwsh.cmd <<< 'set CONDA_PREFIX=%~f0\..\..'
          cat >> $PREFIX/bin/pwsh.cmd <<< 'set ZDOTDIR=%CONDA_PREFIX%/opt/retronvim/zsh'
          cat >> $PREFIX/bin/pwsh.cmd <<< 'zsh.exe'

          ############################################################################################################################

      # https://rattler-build.prefix.dev/latest/system_integration
      # https://prefix.dev/blog/using-pixi-as-a-system-package-manager-with-shortcuts-and-completions
      # https://github.com/conda-forge/alacritty-feedstock/blob/main/recipe/menu.json

      - |
        mkdir                               $PREFIX/Menu
        cp $RECIPE_DIR/terax.{png,ico,icns} $PREFIX/Menu
        cat                              >> $PREFIX/Menu/menu.json <<'EOF'
        {
          "$schema": "https://schemas.conda.org/menuinst/menuinst-1-1-3.schema.json",
          "menu_name": "terax",
          "menu_items": [
            {
              "name": "terax",
              "description": "Lightweight (7MB) Terminal-first AI-native dev workspace",
              "icon": "{{ MENU_DIR }}/terax.{{ ICON_EXT }}",
              "command": [ "{{ HOME }}/.pixi/bin/terax" ],
              "platforms": {
                "osx": {},
                "linux": {
                  "Categories": [ "Development", "TerminalEmulator", "System" ]
                },
                "win": {
                  "command": [ "{{ HOME }}/.pixi/bin/terax.exe" ],
                  "desktop": true
                }
              }
            }
          ]
        }
        EOF

      ############################################################################################################################

requirements:

  run:
    # - chrome
    # - vscode
    # - vlc

    - 7zip=26.00
    - bat=0.26.1
    - eza=0.23.4
    - fd-find=10.4.2
    - firacode-nerdfont-installer=3.4.0
    - fzf=0.70.0
    - git
    - kanata=1.11.0
    - lazygit=0.61.0
    - nvim=0.12.4
    - ripgrep=15.1.0
    - starship=1.24.2
    - terax
    - yazi=26.5.6
    - zsh-patina=1.8.0
    - zsh=5.9

    - if: osx
      then:
        - mise
        - zerobrew

    - if: win
      then:
        - mise-github-release

    - if: linux
      then:
        - file=5.47 # not installed inside docker
        - less=692  # not installed inside docker
        - mise
        - unzip     # required by mason.nvim
        - win32yank # WSL clipboaard
        - zerobrew

tests:
  - package_contents:
      bin:
        - git*
        - kanata*
        - nvim*
        - terax*
        - yazi*
        - zsh*

about:
  summary: minimal lazyvim, terax, yazi, zsh and kanata setup
  description: |
    terax-terminal preconfigured with lazyvim IDE + yazi builtin plugins + zsh plugins + kanata keyboard layout
  homepage: https://github.com/yeferyv/retronvim
  repository: https://github.com/yeferyv/retronvim
