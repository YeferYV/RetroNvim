context:
  version: 1.449.0

package:
  name: copilot-language-server-release
  version: ${{ version }}

source:
  - if: linux
    then:
      url: https://github.com/github/copilot-language-server-release/releases/download/${{ version }}/copilot-language-server-linux-x64-${{ version }}.zip
      target_directory: "bin"

  - if: osx
    then:
      url: https://github.com/github/copilot-language-server-release/releases/download/${{ version }}/copilot-language-server-darwin-x64-${{ version }}.zip
      target_directory: "bin"

  - if: win
    then:
      url: https://github.com/github/copilot-language-server-release/releases/download/${{ version }}/copilot-language-server-win32-x64-${{ version }}.zip
      target_directory: "bin"

build:
  # number: 0 # build version

  dynamic_linking:
    # fixes macos builds from linux: failed to find `install_name_tool`
    # https://rattler-build.prefix.dev/latest/build_options/#dynamic-linking-configuration
    binary_relocation: false

  script:
    interpreter: bash
    content:
      - cp -rv bin $PREFIX


tests:
  - package_contents:
      bin:
        - copilot-language-server*


about:
  summary: Feedback for the GitHub Copilot Language Server
  description: |
    The Copilot Language Server enables any editor or IDE to integrate with GitHub Copilot via the language server protocol.
  homepage: https://www.npmjs.com/package/@github/copilot-language-server
  repository: https://github.com/github/copilot-language-server-release
