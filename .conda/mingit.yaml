# rattler-build build --recipe mingit.yaml --target-platform win-64 --output-dir mingit-channel --build-num=+1 --package-format conda:22

# rm -recurse ~/appdata/local/rattler
# pixi g install      --path ./mingit-channel/win-64/mingit-2.54.0-h9490d1a_1.conda         --force-reinstall

# https://pixi.prefix.dev/dev/reference/cli/pixi/upload/anaconda/
# pixi upload anaconda --owner=retronvim mingit*/*/*conda

context:
  version: 2.54.0

package:
  name: mingit-busybox
  version: ${{ version }}

source:
  - if: win
    then:
      - url: https://github.com/git-for-windows/git/releases/download/v2.54.0.windows.1/MinGit-2.54.0-busybox-64-bit.zip
        target_directory: "opt/mingit"

build:
  # number: 0 # build version

  script:
    interpreter: bash
    content:
      - mkdir     $PREFIX/bin
      - cp -r opt $PREFIX

      - |
        ############################################################################################################################

        cat >> $PREFIX/bin/git.cmd <<< '@echo off'
        cat >> $PREFIX/bin/git.cmd <<< 'set CONDA_PREFIX=%~f0\..\..'
        cat >> $PREFIX/bin/git.cmd <<< '%CONDA_PREFIX%/opt/mingit/mingw64/bin/git.exe %*'

        ############################################################################################################################

        cat >> $PREFIX/bin/busybox.cmd <<< '@echo off'
        cat >> $PREFIX/bin/busybox.cmd <<< 'set CONDA_PREFIX=%~f0\..\..'
        cat >> $PREFIX/bin/busybox.cmd <<< '%CONDA_PREFIX%/opt/mingit/mingw64/bin/busybox.exe %*'

        ############################################################################################################################

tests:
  - package_contents:
      bin:
        - git.cmd
        - busybox.cmd

about:
  summary: A fork of Git containing Windows-specific patches (lazygit compatible)
  description: |
    mingit with busybox from https://github.com/git-for-windows/git/releases

  homepage: http://gitforwindows.org/
  repository: https://github.com/git-for-windows/git
