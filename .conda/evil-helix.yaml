# rattler-build build --recipe evil-helix.yaml --target-platform osx-64   --output-dir evilhelix-channel --build-num=+1
# rattler-build build --recipe evil-helix.yaml --target-platform win-64   --output-dir evilhelix-channel --build-num=+1

# rm -r ~/.cache/rattler
# pixi g install      --path ./evilhelix-channel/linux-64/evil-helix*                          --force-reinstall
# pixi g install      --path ./evilhelix-channel/osx-64/evil-helix*                            --force-reinstall
# pixi g install      --path ./evilhelix-channel/win-64/evil-helix-2025.09.15-h9490d1a_1.conda --force-reinstall

# https://pixi.prefix.dev/dev/reference/cli/pixi/upload/anaconda/
# pixi upload anaconda --owner=retronvim evilhelix*/*/*conda

context:
  version: 2025.09.15

package:
  name: evil-helix
  version: ${{ version }}

source:
  - if: linux
    then:
      url: https://github.com/usagi-flow/evil-helix/releases/download/release-${{ version }}/evil-helix-amd64-linux.tar.gz
      target_directory: "bin"

  - if: win
    then:
      url: https://github.com/usagi-flow/evil-helix/releases/download/release-${{ version }}/evil-helix-amd64-windows.zip
      target_directory: "bin"

  - if: osx
    then:
      url: https://github.com/usagi-flow/evil-helix/releases/download/release-${{ version }}/evil-helix-amd64-macos.tar.gz
      target_directory: "bin"


build:
  # number: 0 # build version

  dynamic_linking:
    # fixes macos builds from linux: failed to find `install_name_tool`
    # https://rattler-build.prefix.dev/latest/build_options/#dynamic-linking-configuration
    binary_relocation: false

  script:
    interpreter: bash
    content:
      - cp -rv bin $PREFIX


tests:
  - package_contents:
      bin:
        - helix*


about:
  summary: Bringing the Helix editor to the evil side
  description: |
    A soft fork of Helix which introduces Vim keybindings and more.
  homepage: https://github.com/usagi-flow/evil-helix
  repository: https://github.com/usagi-flow/evil-helix
