# rattler-build build --recipe zsh-patina.yaml --target-platform linux-aarch64 --output-dir zsh-patina-channel
# rattler-build build --recipe zsh-patina.yaml --target-platform osx-64        --output-dir zsh-patina-channel
# rattler-build build --recipe zsh-patina.yaml --target-platform osx-arm64     --output-dir zsh-patina-channel
# rattler-build build --recipe zsh-patina.yaml --target-platform win-64        --output-dir zsh-patina-channel

# https://pixi.prefix.dev/dev/reference/cli/pixi/clean/cache
# pixi clean cache --build --yes

# https://pixi.prefix.dev/dev/reference/cli/pixi/global/install
# pixi g install --path ./zsh-patina-channel/linux-64/zsh-patina*
# pixi g install --path ./zsh-patina-channel/linux-aarch64/zsh-patina*
# pixi g install --path ./zsh-patina-channel/osx-64/zsh-patina*
# pixi g install --path ./zsh-patina-channel/osx-aarch64/zsh-patina*
# pixi g install --path ./zsh-patina-channel/win-64/zsh-patina-1.8.0-h9490d1a_0.conda

# https://rattler-build.prefix.dev/latest/getting_started/#authentication
# rattler-build auth login anaconda.org --conda-token $ANACONDA_API_KEY

# https://rattler-build.prefix.dev/latest/getting_started/#publishing-the-package
# rattler-build publish --recipe zsh-patina.yaml --target-platform linux-64      --to https://anaconda.org/retronvim
# rattler-build publish --recipe zsh-patina.yaml --target-platform linux-aarch64 --to https://anaconda.org/retronvim
# rattler-build publish --recipe zsh-patina.yaml --target-platform osx-64        --to https://anaconda.org/retronvim
# rattler-build publish --recipe zsh-patina.yaml --target-platform osx-arm64     --to https://anaconda.org/retronvim
# rattler-build publish --recipe zsh-patina.yaml --target-platform win-64        --to https://anaconda.org/retronvim

context:
  version: 1.8.0

package:
  name: zsh-patina
  version: ${{ version }}

source:
  - if: target_platform == "linux-64"
    then:
      - url: https://github.com/michel-kraemer/zsh-patina/releases/download/${{ version }}/zsh-patina-v${{ version }}-x86_64-unknown-linux-musl.tar.gz

  - if: target_platform == "linux-aarch64"
    then:
      - url: https://github.com/michel-kraemer/zsh-patina/releases/download/${{ version }}/zsh-patina-v${{ version }}-aarch64-unknown-linux-musl.tar.gz

  - if: target_platform == "osx-64"
    then:
      - url: https://github.com/michel-kraemer/zsh-patina/releases/download/${{ version }}/zsh-patina-v${{ version }}-x86_64-apple-darwin.tar.gz

  - if: target_platform == "osx-arm64"
    then:
      - url: https://github.com/michel-kraemer/zsh-patina/releases/download/${{ version }}/zsh-patina-v${{ version }}-aarch64-apple-darwin.tar.gz

  - if: target_platform == "win-64"
    then:
      - url: https://github.com/michel-kraemer/zsh-patina/releases/download/${{ version }}/zsh-patina-v${{ version }}-x86_64-pc-cygwin.zip

build:
  # number: 0 # build version

  dynamic_linking:
    # fixes macos builds from linux: failed to find `install_name_tool`
    # https://rattler-build.prefix.dev/latest/build_options/#dynamic-linking-configuration
    binary_relocation: false

  script:
    interpreter: bash
    content:
      - mkdir -p             $PREFIX/bin
      - cp    -r zsh-patina* $PREFIX/bin

tests:
  - package_contents:
      bin:
        - zsh-patina*

about:
  summary: A blazingly fast Zsh syntax highlighter
  description: |
    Besides normal static highlighting, zsh-patina is able to dynamically detect whether a command you entered
    is valid and can be executed and if the arguments refer to existing files or directories.
    By default, invalid commands are shown in red and existing files/directories are underlined
  homepage: https://github.com/michel-kraemer/zsh-patina
  repository: https://github.com/michel-kraemer/zsh-patina
