# https://rattler-build.prefix.dev/latest/tutorials/repackaging
# rattler-build build --recipe mise.yaml --target-platform win-64 --output-dir mise-channel --package-format conda:max

# https://pixi.prefix.dev/dev/reference/cli/pixi/clean/cache
# pixi clean cache --build --yes

# https://pixi.prefix.dev/dev/reference/cli/pixi/global/install
# pixi g install  --path ./mise-channel/win-64/mise-2026.7.7-h9490d1a_0.conda

# https://rattler-build.prefix.dev/latest/getting_started/#authentication
# rattler-build auth login anaconda.org --conda-token $ANACONDA_API_KEY

# https://rattler-build.prefix.dev/latest/getting_started/#publishing-the-package
# rattler-build publish --recipe mise.yaml --target-platform win-64 --to https://anaconda.org/retronvim --package-format conda:max


context:
  version: 2026.7.7

package:
  name: mise-github-release
  version: ${{ version }}

source:
  - if: win
    then:
      - url: https://github.com/jdx/mise/releases/download/v${{ version }}/mise-v${{ version }}-windows-x64.zip

build:
  # number: 0 # build version

  script:
    interpreter: bash
    content:
      - cp bin/*  $PREFIX # if inside any folder errors: mise ERROR bin/mise.exe is not a valid shim

tests:
  - package_contents:
      bin:
        - mise*

about:
  summary: dev tools, env vars, task runner
  description: |
    Install and switch between dev tools like node, python, cmake, terraform, and hundreds more.
  homepage: https://mise.en.dev/
  repository: https://github.com/jdx/mise
