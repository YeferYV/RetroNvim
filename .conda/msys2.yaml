build:
  # number: 0 # build version

  script:
    interpreter: bash
    content:
      - mkdir -p                         $PREFIX/bin $PREFIX/opt/msys2
      - tar xvf msys2.tar.zst            --directory $PREFIX/opt/msys2 --strip-components=1
      - tar xvf git.tar.zst              --directory $PREFIX/opt/msys2
      - tar xvf zsh.tar.zst              --directory $PREFIX/opt/msys2
      - tar xvf openssh.tar.zst          --directory $PREFIX/opt/msys2 # git          dep
      - tar xvf heimdal.tar.zst          --directory $PREFIX/opt/msys2 # openssh      dep
      - tar xvf heimdal-libs.tar.zst     --directory $PREFIX/opt/msys2 # heimdal      dep
      - tar xvf libedit.tar.zst          --directory $PREFIX/opt/msys2 # openssh      dep
      - tar xvf libfido.tar.zst          --directory $PREFIX/opt/msys2 # openssh      dep
      - tar xvf libcbor.tar.zst          --directory $PREFIX/opt/msys2 # libfido      dep
      - tar xvf perl-auth.tar.zst        --directory $PREFIX/opt/msys2 # git          dep
      - tar xvf perl-error.tar.zst       --directory $PREFIX/opt/msys2 # git          dep
      - tar xvf perl-libwww.tar.zst      --directory $PREFIX/opt/msys2 # git          dep
      - tar xvf perl-encode.tar.zst      --directory $PREFIX/opt/msys2 # perl-libwww  dep
      - tar xvf perl-listing.tar.zst     --directory $PREFIX/opt/msys2 # perl-libwww  dep
      - tar xvf perl-cookiejar.tar.zst   --directory $PREFIX/opt/msys2 # perl-libwww  dep
      - tar xvf perl-cookies.tar.zst     --directory $PREFIX/opt/msys2 # perl-libwww  dep
      - tar xvf perl-daemon.tar.zst      --directory $PREFIX/opt/msys2 # perl-libwww  dep
      - tar xvf perl-date.tar.zst        --directory $PREFIX/opt/msys2 # perl-libwww  dep
      - tar xvf perl-message.tar.zst     --directory $PREFIX/opt/msys2 # perl-libwww  dep
      - tar xvf perl-clone.tar.zst       --directory $PREFIX/opt/msys2 # perl-message dep
      - tar xvf perl-html.tar.zst        --directory $PREFIX/opt/msys2 # perl-message dep
      - tar xvf perl-negotiate.tar.zst   --directory $PREFIX/opt/msys2 # perl-libwww  dep
      - tar xvf perl-parser.tar.zst      --directory $PREFIX/opt/msys2 # perl-libwww  dep
      - tar xvf perl-tagset.tar.zst      --directory $PREFIX/opt/msys2 # perl-parser  dep
      - tar xvf perl-mediatypes.tar.zst  --directory $PREFIX/opt/msys2 # perl-libwww  dep
      - tar xvf perl-net.tar.zst         --directory $PREFIX/opt/msys2 # perl-libwww  dep
      - tar xvf perl-try.tar.zst         --directory $PREFIX/opt/msys2 # perl-libwww  dep
      - tar xvf perl-robotrules.tar.zst  --directory $PREFIX/opt/msys2 # perl-libwww  dep
      - tar xvf perl-mime.tar.zst        --directory $PREFIX/opt/msys2 # git          dep
      - tar xvf perl-convert.tar.zst     --directory $PREFIX/opt/msys2 # perl-mime    dep
      - tar xvf perl-io.tar.zst          --directory $PREFIX/opt/msys2 # perl-mime    dep
      - tar xvf perl-mail.tar.zst        --directory $PREFIX/opt/msys2 # perl-mime    dep
      - tar xvf perl-timedate.tar.zst    --directory $PREFIX/opt/msys2 # perl-mail    dep
      - tar xvf perl-ssl.tar.zst         --directory $PREFIX/opt/msys2 # git          dep
      - tar xvf perl-socket.tar.zst      --directory $PREFIX/opt/msys2 # perl-ssl     dep
      - tar xvf perl-ssleay.tar.zst      --directory $PREFIX/opt/msys2 # perl-socket  dep
      - tar xvf perl-uri.tar.zst         --directory $PREFIX/opt/msys2 # perl-socket  dep
      - tar xvf perl-termreadkey.tar.zst --directory $PREFIX/opt/msys2 # git          dep

      - |
        ############################################################################################################################

        cat >> $PREFIX/bin/git.cmd <<< '@echo off'
        cat >> $PREFIX/bin/git.cmd <<< 'set MSYSTEM=MSYS'
        cat >> $PREFIX/bin/git.cmd <<< 'set PATH=%CONDA_PREFIX%\opt\msys2\usr\bin;%PATH%'
        cat >> $PREFIX/bin/git.cmd <<< 'REM %CONDA_PREFIX%/opt/msys2/usr/bin/bash.exe -c "git %*"'
        cat >> $PREFIX/bin/git.cmd <<< '%CONDA_PREFIX%/opt/msys2/usr/bin/git.exe %*'

        ############################################################################################################################

        cat >> $PREFIX/bin/zsh.cmd <<< '@echo off'
        cat >> $PREFIX/bin/zsh.cmd <<< '%CONDA_PREFIX%/opt/msys2/usr/bin/zsh.exe %*'

        ############################################################################################################################

        cat >> $PREFIX/bin/pacman.cmd <<< '@echo off'
        cat >> $PREFIX/bin/pacman.cmd <<< '%CONDA_PREFIX%/opt/msys2/usr/bin/pacman.exe %*'

        ############################################################################################################################

tests:
  - package_contents:
      bin:
        - git.cmd
        - zsh.cmd
        - pacman.cmd

about:
  summary: MSYS2 repackaged with git.exe and zsh.exe exposing pacman.exe
  description: |
    MSYS2 is a collection of tools and libraries providing you with an easy-to-use environment for building,
    installing and running native Windows software.

    To provide easy installation of packages and a way to keep them updated it features a package management
    system called Pacman, which should be familiar to Arch Linux users. It brings many powerful features such
    as dependency resolution and simple complete system upgrades, as well as straight-forward and reproducible
    package building. Our package repository contains more than 3700 pre-built packages ready to install.

  homepage: https://msys2.org
  repository: https://github.com/msys2/msys2-installer
