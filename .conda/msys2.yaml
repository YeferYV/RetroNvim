# https://rattler-build.prefix.dev/latest/tutorials/repackaging/
# rattler-build build --recipe msys2.yaml --target-platform win-64 --output-dir msys2-channel --build-num=+1 --package-format conda:22

# rm -recurse ~/appdata/local/rattler
# pixi g install      --path ./msys2-channel/win-64/msys2-2026.03.22-h9490d1a_1.conda         --force-reinstall

# https://pixi.prefix.dev/dev/reference/cli/pixi/upload/anaconda/
# pixi upload anaconda --owner=retronvim msys2*/*/*conda

context:
  version: 2026.03.22

package:
  name: msys2
  version: ${{ version }}

source:
  - if: win
    then:
      # msys64/usr/bin has zsh dependencies
      - url: https://github.com/msys2/msys2-installer/releases/download/2026-03-22/msys2-base-x86_64-20260322.tar.zst
        file_name: "msys2.tar.zst"

      # https://packages.msys2.org/packages/zsh?variant=x86_64
      - url: https://mirror.msys2.org/msys/x86_64/zsh-5.9-5-x86_64.pkg.tar.zst
        file_name: "zsh.tar.zst"

build:
  # number: 0 # build version

  script:
    interpreter: bash
    content:
      - mkdir -p                         $PREFIX/bin $PREFIX/opt/msys2
      - tar xvf msys2.tar.zst            --directory $PREFIX/opt/msys2 --strip-components=1
      - tar xvf zsh.tar.zst              --directory $PREFIX/opt/msys2

      - |
        ############################################################################################################################

        cat >> $PREFIX/bin/zsh.cmd <<< '@echo off'
        cat >> $PREFIX/bin/zsh.cmd <<< '%CONDA_PREFIX%/opt/msys2/usr/bin/zsh.exe %*'

        ############################################################################################################################

        cat >> $PREFIX/bin/pacman.cmd <<< '@echo off'
        cat >> $PREFIX/bin/pacman.cmd <<< '%CONDA_PREFIX%/opt/msys2/usr/bin/pacman.exe %*'

        ############################################################################################################################

tests:
  - package_contents:
      bin:
        - zsh.cmd
        - pacman.cmd

about:
  summary: MSYS2 repackaged with zsh.exe
  description: |
    MSYS2 is a collection of tools and libraries providing you with an easy-to-use environment for building,
    installing and running native Windows software.

    To provide easy installation of packages and a way to keep them updated it features a package management
    system called Pacman, which should be familiar to Arch Linux users. It brings many powerful features such
    as dependency resolution and simple complete system upgrades, as well as straight-forward and reproducible
    package building. Our package repository contains more than 3700 pre-built packages ready to install.

  homepage: https://msys2.org
  repository: https://github.com/msys2/msys2-installer
